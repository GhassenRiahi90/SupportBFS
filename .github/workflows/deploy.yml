name: Deploy to cPanel (FTP)

# Deploiement FTP vers support.bfs.tn
# Compte FTP chrooté : racine = public_html/support/ → server-dir: /
# Phase 1 : declenchement MANUEL uniquement (workflow_dispatch).
# Pour activer le deploiement auto sur push main, decommenter le bloc push ci-dessous.
# Secrets requis : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    name: Sync MantisBT to support.bfs.tn (FTP chroot)
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-deploy-support-bfs
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, gd, curl, mysqli, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 600000
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            **/tests/**
            **/docbook/**
            **/build/**
            config/config_inc.php
            config/config_inc.php.bak
            config/mantis_offline.php
            **/attachments/**
            **/project/**
